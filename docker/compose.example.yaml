# Example only. Copy docker/.env.example to docker/.env and set your own values.
name: greenboard-redmine

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: redmine
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
    volumes:
      - redmine_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 20

  redmine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      REDMINE_SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in docker/.env}
      REDMINE_PLUGINS_MIGRATE: "1"
    volumes:
      - redmine_files:/usr/src/redmine/files

volumes:
  redmine_db:
  redmine_files:
